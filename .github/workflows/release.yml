name: Release

# 发行方式：发行包由本地 `node scripts/release.mjs <版本>` 构建（需要 NocoBase 工作区的 @nocobase/build），
# 构建产物提交到 release/ 目录；本工作流只做「校验 + 创建 Release + 上传发行包」，因此不依赖网络安装依赖，
# 每次都能稳定通过。
#
# 触发方式：
#   1. 推送 v* 标签；
#   2. 手动触发并填写版本号。main 提交不会自动发布。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号，例如 2.0.0（安装包和校验文件须已提交）'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 解析发行版本号
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            VERSION="$REQUESTED_VERSION"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "非法版本号：$VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "asset=release/plugin-icon-library-$VERSION.tgz" >> "$GITHUB_OUTPUT"
          echo "发行版本号：$VERSION"

      - name: 校验 package.json 与发行包
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ASSET="${{ steps.version.outputs.asset }}"

          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$VERSION" ]; then
            echo "package.json 版本（$PKG_VERSION）与发行版本号（$VERSION）不一致" >&2
            exit 1
          fi

          if [ ! -f "$ASSET" ]; then
            echo "缺少发行包：$ASSET" >&2
            echo "请先执行：node scripts/release.mjs $VERSION，然后提交 release/ 目录" >&2
            exit 1
          fi
          if [ ! -f "$ASSET.sha256" ]; then
            echo "缺少校验文件：$ASSET.sha256" >&2
            exit 1
          fi
          (cd release && sha256sum --check "$(basename "$ASSET").sha256")
          if [ ! -f "RELEASE_NOTES_$VERSION.md" ]; then
            echo "缺少发布说明：RELEASE_NOTES_$VERSION.md" >&2
            exit 1
          fi

          # 校验发行包内 package.json 的版本，确保「发行包里已自动填写发行版」
          INNER_VERSION="$(tar -xzOf "$ASSET" package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")"
          if [ "$INNER_VERSION" != "$VERSION" ]; then
            echo "发行包内版本（$INNER_VERSION）与发行版本号（$VERSION）不一致" >&2
            exit 1
          fi

          echo "校验通过：$ASSET（包内版本 $INNER_VERSION）"
          ls -lh "$ASSET"

      - name: 创建 Release 并上传发行包
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: |
            ${{ steps.version.outputs.asset }}
            ${{ steps.version.outputs.asset }}.sha256
          body_path: RELEASE_NOTES_${{ steps.version.outputs.version }}.md
          draft: false
